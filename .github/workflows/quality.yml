name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check committed Slice and Task contracts
        run: python3 scripts/check_governance.py
      - name: Check governance state transitions in isolated Git repositories
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m py_compile scripts/check_governance.py scripts/bootstrap_repository.py tests/test_governance.py
      - name: Check patch whitespace
        run: git show --format= --check HEAD

# Task 1.1 adds the actual pinned .NET build/test gates once projects exist.
# This workflow does not claim plugin build or Jellyfin runtime acceptance.
