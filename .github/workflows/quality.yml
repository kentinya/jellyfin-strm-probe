name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-repository:
    name: Verify published plugin repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify catalog identity and published ZIP checksums
        run: python3 scripts/check_plugin_repository.py
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check committed Slice and Task contracts
        run: python3 scripts/check_governance.py
      - name: Check governance and development environment guardrails
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m py_compile scripts/check_governance.py scripts/development_environment.py tests/test_governance.py tests/test_development_environment.py
      - name: Check patch whitespace
        run: git show --format= --check HEAD

# Task 1.1 adds the actual pinned .NET build/test gates once projects exist.
# This workflow does not claim plugin build or Jellyfin runtime acceptance.
